<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>8in1 RETRO SYSTEM</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
body { background: #000; display: flex; justify-content: center; align-items: center; min-height: 100dvh; font-family: 'Courier New', Courier, monospace; overflow: hidden; touch-action: none; -webkit-tap-highlight-color: transparent; width: 100vw; height: 100dvh; }

#gameboy { 
  width: 100%; max-width: 450px; height: 100%; max-height: 900px; 
  background: linear-gradient(135deg, #333 0%, #111 100%); 
  border-radius: 20px; display: flex; flex-direction: column; 
  box-shadow: inset -3px -3px 10px rgba(0,0,0,0.8), inset 3px 3px 10px rgba(255,255,255,0.1), 0 0 30px rgba(0,255,100,0.3); 
  border: 1px solid #444; position: relative; opacity: 1; transition: all 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55); 
}

#screen-container { 
  flex: 1; background: linear-gradient(180deg, #1a1a1a 0%, #000 100%); 
  margin: 15px 15px 5px 15px; border-radius: 10px 10px 20px 10px; 
  display: flex; justify-content: center; align-items: center; padding: 10px; 
  border: 2px solid #222; box-shadow: inset 0px 5px 15px rgba(0,0,0,0.9), 0 2px 0 rgba(255,255,255,0.1); 
  position: relative; overflow: hidden; z-index: 5; transition: all 0.8s; 
}
#screen-container::after {
  content: ''; position: absolute; top: 0; left: -50%; width: 200%; height: 100%;
  background: linear-gradient(to bottom, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 40%, rgba(255,255,255,0) 100%);
  transform: rotate(-10deg); pointer-events: none;
}

#boot { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; color: #0f0; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; transition: opacity 0.5s; border-radius: 6px 6px 35px 6px; pointer-events: none; }
#boot.hidden { opacity: 0; }
.boot-text { font-size: 10px; margin: 4px 0; }
.boot-bar { width: 80%; height: 15px; border: 2px solid #0f0; margin-top: 15px; }
.boot-fill { height: 100%; background: #0f0; width: 0%; transition: width 0.1s; }

#gameCanvas { 
  background: #000; height: 100%; width: auto; max-width: 100%; max-height: 100%; 
  aspect-ratio: 1 / 1.5; image-rendering: pixelated; box-shadow: 0 0 15px rgba(0,0,0,0.9); 
  z-index: 1; border-radius: 2px; touch-action: none; transition: all 0.5s; 
}

#controls { height: 300px; position: relative; background: transparent; border-radius: 0 0 20px 20px; overflow: hidden; z-index: 20; transition: all 0.8s; }
#classic-controls { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55); }

.d-btn, .a-btn, .s-btn { touch-action: none; -webkit-tap-highlight-color: transparent; }
#dpad { position: absolute; left: 35px; top: 35px; width: 150px; height: 150px; }

.d-btn { 
  position: absolute; background: #222; border-radius: 4px; 
  box-shadow: inset -2px -2px 5px rgba(0,0,0,0.8), inset 2px 2px 5px rgba(255,255,255,0.1), 0 5px 10px rgba(0,0,0,0.5); 
  cursor: pointer; border: 1px solid #111;
}
.d-btn:active { background: #111; transform: translateY(2px); box-shadow: inset 2px 2px 5px rgba(0,0,0,0.9); }
#btn-up { top: 0; left: 50px; width: 50px; height: 50px; border-radius: 5px 5px 0 0; }
#btn-down { bottom: 0; left: 50px; width: 50px; height: 50px; border-radius: 0 0 5px 5px; }
#btn-left { top: 50px; left: 0; width: 50px; height: 50px; border-radius: 5px 0 0 5px; }
#btn-right { top: 50px; right: 0; width: 50px; height: 50px; border-radius: 0 5px 5px 0; }
.d-center { top: 50px; left: 50px; width: 50px; height: 50px; background: #222; position: absolute; box-shadow: none; border:none; z-index: 2;}

#action-buttons { position: absolute; right: 25px; top: 55px; width: 160px; height: 120px; transform: rotate(-15deg); }
.a-btn { 
  position: absolute; width: 70px; height: 70px; border-radius: 50%; font-weight: bold; font-size: 24px; text-align: center; line-height: 70px; 
  cursor: pointer; border: 2px solid #111;
}
#btn-a { 
  background: radial-gradient(circle at 30% 30%, #ff4444, #990000); color: #fff; text-shadow: 0 0 5px #fff;
  box-shadow: inset -4px -4px 10px rgba(0,0,0,0.6), inset 2px 2px 8px rgba(255,255,255,0.5), 0 6px 12px rgba(0,0,0,0.8); right: 0; top: 0;
}
#btn-a:active { background: #770000; transform: translateY(4px); box-shadow: inset 2px 2px 10px rgba(0,0,0,0.9); }
#btn-b { 
  background: radial-gradient(circle at 30% 30%, #4444ff, #000099); color: #fff; text-shadow: 0 0 5px #fff;
  box-shadow: inset -4px -4px 10px rgba(0,0,0,0.6), inset 2px 2px 8px rgba(255,255,255,0.5), 0 6px 12px rgba(0,0,0,0.8); left: 0; bottom: 0;
}
#btn-b:active { background: #000077; transform: translateY(4px); box-shadow: inset 2px 2px 10px rgba(0,0,0,0.9); }

.btn-label { position: absolute; font-size: 16px; color: #aaa; font-family: 'Courier New', Courier, monospace; font-weight: bold; letter-spacing: 2px; pointer-events: none; }
#label-b { left: 25px; bottom: -28px; } #label-a { right: 25px; top: -28px; }

#sys-buttons { position: absolute; bottom: 35px; width: 100%; display: flex; justify-content: center; z-index: 30; }
.s-btn-wrap { text-align: center; }
.s-btn { 
  width: 70px; height: 20px; background: #222; border-radius: 10px; 
  box-shadow: inset -2px -2px 5px rgba(0,0,0,0.8), inset 2px 2px 5px rgba(255,255,255,0.1), 0 4px 6px rgba(0,0,0,0.5); 
  transform: rotate(-15deg); cursor: pointer; border: 1px solid #111;
}
.s-btn:active { background: #111; transform: rotate(-15deg) translateY(2px); box-shadow: inset 2px 2px 5px rgba(0,0,0,0.8); }
.s-label { font-size: 12px; color: #aaa; font-weight: bold; margin-top: 8px; transition: color 0.5s; }
</style>
</head>
<body>
<div id="gameboy">
  <div id="screen-container">
    <div id="boot">
      <div class="boot-text">8in1 RETRO SYSTEM</div>
      <div class="boot-text">SYSTEM BOOTING...</div>
      <div class="boot-bar"><div class="boot-fill" id="bootProgress"></div></div>
      <div class="boot-text" id="bootStatus" style="margin-top: 10px;">Loading...</div>
    </div>
    
    <canvas id="gameCanvas" width="200" height="300"></canvas>
  </div>
  
  <div id="controls">
    <div id="classic-controls">
      <div id="dpad">
        <div class="d-center"></div>
        <div class="d-btn" id="btn-up"></div>
        <div class="d-btn" id="btn-down"></div>
        <div class="d-btn" id="btn-left"></div>
        <div class="d-btn" id="btn-right"></div>
      </div>
      <div id="action-buttons">
        <div class="a-btn" id="btn-b">B</div>
        <div class="btn-label" id="label-b">B</div>
        <div class="a-btn" id="btn-a">A</div>
        <div class="btn-label" id="label-a">A</div>
      </div>
    </div>

    <div id="sys-buttons">
      <div class="s-btn-wrap"><div class="s-btn" id="btn-select"></div><div class="s-label">SELECT</div></div>
    </div>
  </div>
</div>

<script>
let bootProgress = 0;
const bootInterval = setInterval(() => {
  bootProgress += Math.random() * 15;
  if (bootProgress > 100) bootProgress = 100;
  document.getElementById('bootProgress').style.width = bootProgress + '%';
  document.getElementById('bootStatus').textContent = bootProgress < 90 ? 'Checking Memory...' : 'OK!';
  if (bootProgress >= 100) {
    clearInterval(bootInterval);
    setTimeout(() => { document.getElementById('boot').classList.add('hidden'); }, 500);
  }
}, 100);
</script>

<script src="sprites.js"></script>
<script src="pc.js"></script>
<script src="main.js"></script>
<script src="guide.js"></script>
<script src="tetri.js"></script>
<script src="action.js"></script>
<script src="online.js"></script>
<script src="rhythm.js"></script>
<script src="slot.js"></script>
<script src="king.js"></script>
<script src="musou.js"></script>
<script src="abyss.js"></script>
<script src="noise.js"></script>
<script>
window.onload = () => {
  activeApp = Menu;
  activeApp.init();
  requestAnimationFrame(loop);
};
</script>
</body>
</html>
